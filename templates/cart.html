<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Deal Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1E5EFF;
            --secondary-color: #FF3B30;
            --success-color: #28A745;
            --background-color: #FFFFFF;
            --text-primary-color: #1C1C1E;
            --text-secondary-color: #6E6E73;
            --card-background-color: #F9F9F9;
        }
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-primary-color);
            padding-bottom: 80px; /* Space for bottom nav */
        }
        .container {
            max-width: 1200px;
            margin: auto;
            overflow: auto;
            padding: 16px;
        }
        .header {
            padding: 1rem 0;
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .cart-item {
            display: flex;
            background-color: var(--card-background-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            align-items: center;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 16px;
        }
        .cart-item .item-details {
            flex-grow: 1;
        }
        .cart-item .item-name {
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }
        .cart-item .item-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .cart-summary {
            background-color: var(--card-background-color);
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .summary-row.total {
            font-weight: 700;
            font-size: 18px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #E5E5E5;
        }
        .checkout-btn {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: #fff;
            height: 48px;
            line-height: 48px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            margin-top: 24px;
            transition: background 0.3s ease;
        }
        .checkout-btn:hover {
            background: #0045d8;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #fff;
            border-top: 1px solid #E5E5E5;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-secondary-color);
        }
        .bottom-nav .nav-item.active {
            color: var(--primary-color);
        }
        .bottom-nav .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }
        .bottom-nav .nav-item .nav-text {
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Your Cart</h1>
        </header>

        <div style="background-color: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; padding: 16px; margin-bottom: 24px; text-align: center;">
            <p style="margin: 0; font-weight: 500;">Note: This page is a static UI demonstration. The functionality is not yet implemented.</p>
        </div>

        <div class="cart-items">
            <div class="cart-item">
                <img src="https://via.placeholder.com/80x80" alt="Product Image">
                <div class="item-details">
                    <h3 class="item-name">Example Product 1</h3>
                    <p class="item-price">₹799</p>
                </div>
            </div>
            <div class="cart-item">
                <img src="https://via.placeholder.com/80x80" alt="Product Image">
                <div class="item-details">
                    <h3 class="item-name">Example Product 2</h3>
                    <p class="item-price">₹499</p>
                </div>
            </div>
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span>₹1298</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>FREE</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span>₹1298</span>
            </div>
        </div>

        <a href="#" class="checkout-btn">Proceed to Checkout</a>

    </div>

    <nav class="bottom-nav">
        <a href="/deals" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span class="nav-text">Home</span>
        </a>
        <a href="/categories" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span class="nav-text">Categories</span>
        </a>
        <a href="/cart" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="nav-text">Cart</span>
        </a>
        <a href="/profile" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span class="nav-text">Profile</span>
        </a>
    </nav>
</body>
</html>
