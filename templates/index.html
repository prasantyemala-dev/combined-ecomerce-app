<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Deal Finder</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; background-color: #f4f4f4; }
        .container { max-width: 1200px; margin: auto; overflow: auto; padding: 0 20px; }
        .header { background: #333; color: #fff; padding: 1rem 0; text-align: center; margin-bottom: 20px;}
        .search-form { text-align: center; margin-bottom: 20px; }
        .search-form input[type="text"] { padding: 10px; width: 300px; }
        .search-form input[type="submit"] { padding: 10px 20px; background: #007bff; color: #fff; border: none; cursor: pointer; }
        .deal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); grid-gap: 20px; }
        .deal-card { background: #fff; border: 1px solid #ddd; padding: 20px; text-align: center; }
        .deal-card img { max-width: 100%; height: auto; max-height: 150px; }
        .deal-card h3 { font-size: 1.1rem; margin: 10px 0; height: 50px; overflow: hidden; }
        .deal-card .price { font-size: 1.2rem; color: #b12704; font-weight: bold; }
        .deal-card .savings { color: #555; }
        .deal-card a { text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Top E-commerce Deals (60%+ Off)</h1>
    </header>
    <div class="container">
        <form action="/" method="post" class="search-form">
            <input type="text" name="keywords" value="{{ keywords }}" placeholder="Enter keywords (e.g., 'laptop', 'headphones')">
            <input type="submit" value="Search">
        </form>

        {% if error %}
            <p style="color: red; text-align: center;">{{ error }}</p>
        {% endif %}

        <div class="deal-grid">
            {% for item in items %}
                <div class="deal-card">
                    <a href="{{ item.url }}" target="_blank">
                        <img src="{{ item.image_url }}" alt="{{ item.title }}">
                        <h3>{{ item.title }}</h3>
                    </a>
                    <p class="price">{{ item.price }}</p>
                    <p class="savings">{{ item.savings }} ({{ item.savings_percent }}%)</p>
                </div>
            {% elif not error %}
                <p>No deals found for this search. Please try again.</p>
            {% endfor %}
        </div>
    </div>
    <script type='text/javascript'>
      var cId = '244540';

      (function(d, t) {
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.async = true;
        s.src = (document.location.protocol == 'https:' ? 'https://cdn0.cuelinks.com/js/' : 'http://cdn0.cuelinks.com/js/')  + 'cuelinksv2.js';
        document.getElementsByTagName('body')[0].appendChild(s);
      }());
    </script>
</body>
</html>
