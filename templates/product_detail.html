<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail - Deal Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1E5EFF;
            --secondary-color: #FF3B30;
            --success-color: #28A745;
            --background-color: #FFFFFF;
            --text-primary-color: #1C1C1E;
            --text-secondary-color: #6E6E73;
            --card-background-color: #F9F9F9;
        }
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-primary-color);
            padding-bottom: 80px; /* Space for bottom nav */
        }
        .container {
            max-width: 1200px;
            margin: auto;
            overflow: auto;
            padding: 16px;
        }
        .product-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .product-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .price-section {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        .current-price {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-right: 12px;
        }
        .original-price {
            font-size: 18px;
            color: var(--text-secondary-color);
            text-decoration: line-through;
            margin-right: 12px;
        }
        .discount-badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .comparison-list {
            margin-bottom: 24px;
        }
        .comparison-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: var(--card-background-color);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .comparison-item .vendor-name {
            font-size: 16px;
            font-weight: 500;
        }
        .comparison-item .vendor-price {
            font-size: 16px;
            font-weight: 700;
        }
        .cta-section {
            display: flex;
            gap: 16px;
        }
        .buy-now-btn {
            flex-grow: 1;
            display: block;
            background: var(--primary-color);
            color: #fff;
            height: 48px;
            line-height: 48px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .wishlist-btn {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .wishlist-btn svg {
            width: 24px;
            height: 24px;
            color: var(--text-secondary-color);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #fff;
            border-top: 1px solid #E5E5E5;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-secondary-color);
        }
        .bottom-nav .nav-item.active {
            color: var(--primary-color);
        }
        .bottom-nav .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }
        .bottom-nav .nav-item .nav-text {
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="background-color: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; padding: 16px; margin-bottom: 24px; text-align: center;">
            <p style="margin: 0; font-weight: 500;">Note: This page is a static UI demonstration. The functionality is not yet implemented.</p>
        </div>
        <img src="https://via.placeholder.com/600x400" alt="Product Image" class="product-image">
        <h1 class="product-title">Example Product Name - High Quality Gadget</h1>
        <div class="price-section">
            <span class="current-price">₹799</span>
            <span class="original-price">₹1599</span>
            <span class="discount-badge">50% OFF</span>
        </div>

        <div class="comparison-list">
            <div class="comparison-item">
                <span class="vendor-name">Amazon</span>
                <span class="vendor-price">₹799</span>
            </div>
            <div class="comparison-item">
                <span class="vendor-name">Flipkart</span>
                <span class="vendor-price">₹820</span>
            </div>
            <div class="comparison-item">
                <span class="vendor-name">Ajio</span>
                <span class="vendor-price">₹805</span>
            </div>
            <div class="comparison-item">
                <span class="vendor-name">Meesho</span>
                <span class="vendor-price">₹810</span>
            </div>
        </div>

        <div class="cta-section">
            <a href="#" class="buy-now-btn">Proceed to Buy</a>
            <button class="wishlist-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/deals" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span class="nav-text">Home</span>
        </a>
        <a href="/categories" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span class="nav-text">Categories</span>
        </a>
        <a href="/cart" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="nav-text">Cart</span>
        </a>
        <a href="/profile" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span class="nav-text">Profile</span>
        </a>
    </nav>
</body>
</html>
