<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Deal Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #1C1C1E;
        }
        .welcome-container {
            max-width: 600px;
            padding: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700; /* Bold */
            margin-bottom: 24px;
        }
        .get-started-btn {
            display: inline-block;
            background: #1E5EFF;
            color: #fff;
            padding: 0 30px; /* padding top/bottom will be controlled by height */
            height: 48px;
            line-height: 48px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px; /* Subtitle size */
            font-weight: 500; /* Medium */
            transition: background 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .get-started-btn:hover {
            background: #0045d8; /* A slightly darker shade for hover */
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Find the best deals every day</h1>
        <a href="/deals" class="get-started-btn">Get Started</a>
    </div>
</body>
</html>
